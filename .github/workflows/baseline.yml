name: Baseline checks

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  web-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-fixture
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: node tests/security/next-patch.mjs
      - run: node tests/hosted/check-workflow.mjs
      - run: node tests/self-host/check-config.mjs
      - run: npm run lint:ci
      - run: npm run typecheck:ci
      - run: npm run test:ci
      - run: npm run build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/containment.py

  database-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.117.0
      - run: supabase start --workdir tests/hosted
      - run: node tests/hosted/database-baseline.mjs
      - if: always()
        run: supabase stop --workdir tests/hosted --no-backup
