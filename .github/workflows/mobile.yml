name: Mobile package checks

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  mobile-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      - run: node tests/mobile/check-uuid.mjs
      - run: node tests/mobile/check-boundary.mjs
      - run: npm run bundle --prefix apps/mobile
