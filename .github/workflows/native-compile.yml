name: Native compilation checks

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - run: npm ci
      - run: node tests/mobile/check-native-workflow.mjs
      - run: python3 tests/mobile/check-native-artifacts.py --self-test

  android-compile:
    needs: native-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run(['sdkmanager', '--licenses'], input='y\n' * 100, text=True, check=True, timeout=180)
          PY
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: node ../../tests/mobile/prepare-native.mjs android
      - run: bash android/gradlew -p android assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - run: python3 ../../tests/mobile/check-native-artifacts.py android android/app/build/outputs/apk/release/app-release.apk

  ios-compile:
    needs: native-contract
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - run: xcodebuild -version
      - run: npm ci
      - run: node ../../tests/mobile/prepare-native.mjs ios
      - run: pod install --project-directory=ios
      - run: xcodebuild -workspace ios/PoppinBuildSpike.xcworkspace -scheme PoppinBuildSpike -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO -quiet
      - run: python3 ../../tests/mobile/check-native-artifacts.py ios build/ios/Build/Products/Release-iphonesimulator/PoppinBuildSpike.app
