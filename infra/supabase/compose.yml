# Disposable GitHub test stack. Railway deploys these images with private DNS,
# a real HTTPS API_URL and signup disabled except during the bounded probe.
services:
  db:
    image: poppin-sb-db:ci
    build: ./db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      JWT_SECRET: ${JWT_SECRET:?required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?required}
      REST_DB_PASSWORD: ${REST_DB_PASSWORD:?required}
      JWT_EXP: '3600'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 30
  mail:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    environment:
      MP_SMTP_BIND_ADDR: '[::]:1025'
      MP_UI_BIND_ADDR: '[::]:8025'
      MP_MAX_MESSAGES: '100'
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
  auth:
    image: supabase/gotrue:v2.189.0@sha256:385184459f57569c54c25209f51f3b2be99ddd7c4ce9e3555b5d3eea8447b7cf
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: '::'
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: ${API_URL:?required}
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD:?required}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?required}
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: '1025'
      GOTRUE_SMTP_USER: fixture
      GOTRUE_SMTP_PASS: fixture-mail-only
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@poppin.invalid
      GOTRUE_SMTP_SENDER_NAME: Poppin Staging
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: '2'
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_LOG_LEVEL: warn
  rest:
    image: postgrest/postgrest:v14.12@sha256:54000f24847d01a2c2302e0041cf0618b875c57fb48507d743cfa9aaa50bf43c
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:${REST_DB_PASSWORD:?required}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?required}
      PGRST_SERVER_HOST: '*'
      PGRST_SERVER_PORT: '3000'
      PGRST_DB_MAX_ROWS: '1000'
  gateway:
    image: poppin-sb-gateway:ci
    build: ./gateway
    ports: ['127.0.0.1:54329:8080']
    environment:
      SB_AUTH_HOST: auth
      SB_REST_HOST: rest
      ANON_KEY: ${ANON_KEY:?required}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?required}
volumes:
  db-data: {}
